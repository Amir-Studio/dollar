name: Deploy Dollar Supabase API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-api/**"
      - "supabase/config.toml"
      - "worker/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase deployment token
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. The connected Supabase function was deployed directly; add SUPABASE_ACCESS_TOKEN only if you want GitHub-driven redeploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle shared market engine
        if: steps.credentials.outputs.configured == 'true'
        run: |
          mkdir -p supabase/functions/market-api/worker
          cp worker/index.js worker/forecast-engine.js supabase/functions/market-api/worker/

      - name: Deploy market and news API
        if: steps.credentials.outputs.configured == 'true'
        run: npx --yes supabase@latest functions deploy market-api --project-ref oolfbjxclhzlbwjmzxxx --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
