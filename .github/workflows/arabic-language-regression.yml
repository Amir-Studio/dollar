name: Arabic and bilingual news regression
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "test/**"
      - ".github/workflows/arabic-language-regression.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/arabic-academic-engine.test.js test/arabic-formal-grammar.test.js
