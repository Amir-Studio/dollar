name: Dollar market API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public market API health
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            "https://oolfbjxclhzlbwjmzxxx.supabase.co/functions/v1/market-api/health"
      - name: Check news feed endpoint
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "https://oolfbjxclhzlbwjmzxxx.supabase.co/functions/v1/market-api/news"
