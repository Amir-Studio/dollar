name: Dollar language engine tests

on:
  push:
    branches:
      - main
      - language-pragmatics-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run automated tests
        run: npm test
